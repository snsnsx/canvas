<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>onCanvas</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=3" sizes="16x16" type="image/png">
<link rel="alternate icon" href="/favicon.ico?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#eceeed">
<!-- GSAP (локально) — плавные переходы между страницами. Классический скрипт
     грузится до отложенного модуля, поэтому window.gsap доступен в tools.js. -->
<script src="/gsap.min.js"></script>
<style>
  :root {
    color-scheme: light;
    /* Два материала интерфейса: серый «стол» — и всё белое, что на нём лежит.
       Лист и панели одного тона, серый работает только как разделяющий их фон. */
    --app-bg: #eceeed;
    --paper: #ffffff;
    --text: #151515;
    --muted: #6b6f6d;
    --line: rgba(21, 21, 21, 0.11);
    --line-strong: rgba(21, 21, 21, 0.18);
    --panel: rgba(255, 255, 255, 0.9);
    --panel-solid: #ffffff;
    /* Кромка бумаги — чуть заметнее внутренних линий: это край материала. */
    --paper-edge: rgba(21, 21, 21, 0.15);
    --paper-radius: 8px;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.10), 0 2px 10px rgba(0, 0, 0, 0.05);
    --accent: #10a37f;
    --accent-soft: rgba(57, 77, 254, 0.13);
    --accent-line: rgba(57, 77, 254, 0.25);
    --danger: #cf2e2e;
    --ui-strong: #151515;
    --radius: 8px;
    --control: 32px;
    /* Радиусы двух кнопок толщины настраиваются независимо друг от друга. */
    --size-small-button-radius: 10px;
    --size-large-button-radius: 12px;

    /* Шкала отступов тулбаров.
       Считаем расстояния между «чернилами» — видимыми глифами, а не между
       боксами кнопок: тап-цель у всех одна (--control), а глиф внутри разный
       (точка пера 18px, скос маркера 12px, иконка 21px, залитая пилюля — во
       всю ширину). Один и тот же gap давал бы на вид разные зазоры, поэтому
       отступы корректируются на «воздух» внутри тап-цели — --tb-slack-*.
       Три ступени, каждая заметно крупнее предыдущей:
         сосед по набору ~15px → соседний набор ~22px → соседняя группа 28px. */
    --tb-pad: 4px;      /* внутренний отступ корпуса панели */
    --tb-item: 2px;     /* зазор между тап-целями внутри набора */
    --tb-set: 3px;      /* добавка на границе наборов внутри одной группы */
    --tb-group: 10px;   /* от разделителя до глифа — поровну с обеих сторон */
    --tb-pen-control: 24px; /* компактнее только ряд цветов пера */
    /* Отступ от корпуса до глифа равен вертикальному: панель обтекает кнопки
       одинаково со всех сторон. */
    --tb-edge: calc(var(--tb-pad) + var(--tb-slack-dot));
    --tb-slack-dot: calc((var(--control) - 18px) / 2);      /* точка пера / размер */
    --tb-slack-pen: calc((var(--tb-pen-control) - 18px) / 2);
    --tb-slack-icon: calc((var(--control) - 21px) / 2);     /* иконка */

    /* Верхняя строка интерфейса складывается из трёх величин, и обе внешние —
       именно те зазоры, которые видно: от края окна до панели и от панели до
       кромки листа. Высота панели считается, а не подбирается, поэтому запас
       сверху сам подстраивается под --control и --tb-pad. */
    --chrome-top: max(4px, env(safe-area-inset-top));   /* окно → верх панели */
    --chrome-gap: 4px;                                   /* низ панели → кромка листа */
    /* Зазор между соседними панелями верхней полосы. Заметно крупнее любого
       шага ВНУТРИ панели (--tb-group: 10px): там расстояние между наборами
       кнопок, здесь — между отдельными предметами на столе, у каждого своя
       кромка и своя тень. Виден он только на узком экране, где панели сходятся
       вплотную; на широком его съедают автополя средней панели. */
    --chrome-band-gap: 12px;
    --chrome-h: calc(var(--control) + var(--tb-pad) * 2 + 2px);
    /* Запас сверху: холст начинается ниже панели инструментов, чтобы toolbar
       не перекрывал то, что можно нарисовать у верхнего края. С трёх остальных
       сторон лист просто приподнят над краем окна. --side-reserve — это ширина
       стола у края окна: слева она и есть поле листа, справа за ней начинается
       дорожка прокрутки. */
    --top-reserve: calc(var(--chrome-top) + var(--chrome-h) + var(--chrome-gap));
    --side-reserve: max(8px, env(safe-area-inset-left), env(safe-area-inset-right));
    --bottom-reserve: max(10px, env(safe-area-inset-bottom));

    /* Полоса прокрутки убрана с бумаги на стол — в свою дорожку справа от листа.
       Её внешний край стоит на тех же --side-reserve от окна, что и левое поле
       листа: стол по краям окна везде одной ширины, а лист просто уступает
       справа ширину дорожки. */
    --scroll-w: 10px;
    --scroll-gap: 6px;                                   /* полоса → кромка листа */
    --scroll-lane: calc(var(--scroll-w) + var(--scroll-gap));
    /* Кромки листа: левая — она же левый край панели страниц, правая — правый
       край toolbar. Панели и бумага держат общую вертикаль, дорожка прокрутки
       проходит снаружи от них справа. */
    --paper-left: var(--side-reserve);
    --paper-right: calc(var(--side-reserve) + var(--scroll-lane));
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--app-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    position: fixed;
    inset: 0;
    /* Стол, на котором лежит лист: серый фон видно в полосе под панелями,
       у нижнего края и в скруглениях углов бумаги. */
    background: var(--app-bg);
  }

  .stage {
    position: absolute;
    inset: var(--top-reserve, 0px) var(--paper-right, 0px) var(--bottom-reserve, 0px) var(--paper-left, 0px);
    overflow: hidden;
    /* Углы запечены в самом листе: overflow срезает по этому радиусу и холсты,
       и плавающие окна, и уезжающую на резинке бумагу. */
    border-radius: var(--paper-radius);
    background: var(--paper);
    cursor: crosshair;
  }

  /* Кромка листа по всем четырём сторонам: теперь стол виден и по бокам, так
     что обрывать линию на углах было бы нечем. Отдельный слой поверх холстов,
     а не border у .stage: рамка сдвинула бы содержимое и увела координаты пера
     от экранных. */
  .stage::after {
    content: "";
    position: absolute;
    z-index: 16;
    inset: 0;
    border: 1px solid var(--paper-edge);
    border-radius: inherit;
    pointer-events: none;
  }

  .stage.erase {
    cursor: none;
  }

  .stage.lasso {
    cursor: default;
  }

  /* Курсор над «хватом» изображения. Правило идёт последним, поэтому берёт верх
     и над ластиком (где курсор скрыт), и над лассо — при равной специфичности. */
  .stage.grab {
    cursor: grab;
  }

  .stage.grabbing {
    cursor: grabbing;
  }

  /* Только три холста самого листа — они лежат друг на друге во всю рабочую
     область. Холсты плавающих окон вложены глубже и живут по своим правилам,
     поэтому здесь именно дочерний комбинатор, а не «любой canvas внутри». */
  .stage > canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #back {
    z-index: 1;
    background: var(--paper);
  }

  #ink {
    z-index: 2;
    pointer-events: none;
  }

  #overlay {
    z-index: 3;
    touch-action: none;
  }

  /* Верхняя полоса: три панели одного набора в одном ряду.
     Раньше каждая висела сама по себе на position: fixed, и панель разговора,
     выставленная по центру ОКНА, налезала на шапку инструментов — та занимает
     справа шестьсот с лишним пикселей и достаёт до середины экрана. В общем
     ряду середина считается не от окна, а от свободного места между соседями
     (margin-inline: auto у средней панели), поэтому наложение невозможно по
     построению — при любой ширине окна и любом наборе кнопок.
     Сама полоса указатель не ловит: между панелями рисуют по листу. */
  .chrome-band {
    position: fixed;
    z-index: 20;
    top: var(--chrome-top);
    left: var(--paper-left);
    right: var(--paper-right);
    display: flex;
    align-items: flex-start;
    gap: var(--chrome-band-gap);
    pointer-events: none;
  }

  .chrome-band > * {
    pointer-events: auto;
  }

  .toolbar {
    order: 3;
    flex: 0 1 auto;              /* тесно станет — сожмётся только шапка */
    width: max-content;
    max-width: 100%;
    display: flex;
    align-items: stretch;
    /* Весь горизонтальный воздух между группами живёт в padding самих групп —
       так разделитель оказывается ровно посередине зазора. */
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .toolbar::-webkit-scrollbar {
    display: none;
  }

  .group {
    /* Чем заполнены края группы — от этого зависит, сколько «воздуха» кнопка
       приносит с собой и сколько отступа нужно добавить. Края считаются
       отдельно: слева у группы может стоять иконка, а справа — точка. */
    --tb-slack: var(--tb-slack-icon);
    --tb-slack-end: var(--tb-slack);
    display: flex;
    align-items: center;
    gap: var(--tb-item);
    min-width: max-content;
    padding-inline-start: calc(var(--tb-group) - var(--tb-slack));
    padding-inline-end: calc(var(--tb-group) - var(--tb-slack-end));
    border-right: 1px solid var(--line);
  }

  .group.colors { --tb-slack: var(--tb-slack-dot); }
  .group.pen-colors { --tb-slack: var(--tb-slack-pen); }
  .group.tools { --tb-slack-end: var(--tb-slack-dot); }  /* справа — «размеры» */
  .group.status { --tb-slack: 0px; }

  /* Крайние группы прижимаются к корпусу панели, а не к соседу, поэтому у них
     внешний отступ считается от --tb-edge, а не от --tb-group. */
  .group:first-child {
    padding-inline-start: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack)));
  }

  .group:last-child {
    padding-inline-end: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack-end)));
    border-right: 0;
  }

  /* Начало нового набора внутри группы: ступень заметнее, чем между соседями,
     но мельче, чем через разделитель. Ею же отодвигаются разрушающие действия
     (очистить страницу, удалить страницу) — чтобы не попасть в них промахом. */
  .set-start {
    margin-inline-start: var(--tb-set);
  }

  .group-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .swatches,
  .sizes,
  .segmented {
    display: flex;
    align-items: center;
    gap: var(--tb-item);
  }

  .btn,
  .swatch,
  .size {
    width: var(--control);
    height: var(--control);
    border: 1px solid transparent;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }

  .btn {
    padding: 0 10px;
    width: auto;
    min-width: var(--control);
    font-size: 13px;
    font-weight: 570;
    white-space: nowrap;
  }

  .btn.icon {
    width: var(--control);
    padding: 0;
    font-size: 16px;
  }

  .btn.icon .m-icon {
    width: 21px;
    height: 21px;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.18));
    transition: transform 140ms ease, filter 140ms ease;
  }

  #eraserBtn .m-icon {
    width: 22px;
    height: 22px;
  }

  #exportBtn .m-icon {
    width: 18px;
    height: 18px;
  }

  .btn.icon:hover .m-icon,
  .btn.icon.on .m-icon {
    transform: translateY(-1px);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
  }

  .btn.icon:disabled .m-icon {
    filter: grayscale(0.75) opacity(0.55);
  }

  .m-edge {
    stroke: rgba(29, 34, 32, 0.22);
    stroke-width: 1;
  }

  .m-highlight {
    fill: rgba(255, 255, 255, 0.62);
  }

  .btn:hover {
    background: rgba(21, 21, 21, 0.055);
  }

  .btn:focus-visible,
  .swatch:focus-visible,
  .size:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 2px;
  }

  .btn.on {
    border-color: var(--accent-line);
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px rgba(16, 163, 127, 0.08);
  }

  .btn:active,
  .swatch:active,
  .size:active {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.34;
    cursor: default;
    transform: none;
  }

  .btn.danger {
    color: var(--danger);
  }

  .swatch {
    padding: 0;
  }

  /* Цвета пера собраны плотнее: видимый зазор между 18px-точками уменьшается
     с 16 до 8px, а высота зоны нажатия остаётся общей для всего toolbar. */
  #penColors .swatch {
    width: var(--tb-pen-control)+2px;
  }

  .size {
    --size-glyph-width: 18px;
    --size-button-radius: var(--size-small-button-radius);
    width: calc(var(--size-glyph-width) + 14px);
    border-radius: var(--size-button-radius);
  }

  .size[data-i="2"] {
    --size-glyph-width: 26px;
    --size-button-radius: var(--size-large-button-radius);
  }

  .swatch .dot {
    width: 25px;
    height: 20px;
    border-radius: 9px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    transition: box-shadow 120ms ease, transform 120ms ease;
  }

  /* Скос маркера узкий — 12px против 18px у точки пера. При одинаковых боксах
     пара «жёлтый/фиолетовый» разъехалась бы на вид сильнее, чем расходятся
     целые группы, поэтому лишние 4px «воздуха» срезаны с бокса: цвета остаются
     собранными, но не слипаются. Высота тап-цели —
     а с ней и удобство попадания сверху пером — не меняется. */
  .swatch.hl {
    width: calc(var(--control) - 4px);
  }

  .swatch.hl .dot {
    width: 25px;
    height: 20px;
    border-radius: 8px;
  }

  .swatch:hover .dot {
    box-shadow:
      0 0 0 3px rgba(21, 21, 21, 0.055),
      inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }

  .swatch.sel .dot {
    box-shadow:
      0 0 0 3px var(--accent-line),
      inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }

  /* Номер набран прямо по залитой пилюле: ширина пилюли и так показывает
     толщину, цифра лишь называет её — поэтому бокс кнопки не меняется. */
  .size .pip {
    position: relative;
    width: var(--size-glyph-width);
    height: 18px;
    display: inline-grid;
    place-items: center;
    border-radius: var(--size-button-radius);
    background: var(--text);
    color: var(--paper);
    font-size: 11px;
    font-weight: 640;
    line-height: 1;
    transition: box-shadow 120ms ease, transform 120ms ease;
  }

  .size:hover .pip {
    box-shadow: 0 0 0 7px rgba(21, 21, 21, 0.055);
  }

  .size.sel .pip {
    box-shadow:
      0 0 0 4px var(--accent-line);
  }

  .presence {
    border: 0;
    min-height: var(--control);
    min-width: 58px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
    white-space: nowrap;
    cursor: pointer;
    transition: background 120ms ease, transform 120ms ease;
  }

  .presence:hover {
    background: rgba(21, 21, 21, 0.065);
  }

  .presence:active {
    transform: translateY(1px);
  }

  .presence-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(16, 163, 127, 0.12);
  }

  /* --- Разговор --------------------------------------------------------- */

  /* Третья панель того же набора: корпус, высота и радиус повторяют .toolbar и
     .pagebar буква в букву — иначе она читалась бы как чужая деталь поверх
     доски. Сверху по центру: разговор не принадлежит ни страницам слева, ни
     инструментам справа, и середина — единственное место, где он никого не
     теснит. Внутри — обычная .group, поэтому вся арифметика отступов
     («воздух» внутри тап-цели, края к корпусу) достаётся ей даром. */
  .voicebar {
    order: 2;
    /* Единственная панель полосы, которой позволено сжиматься, — эта.
       Раньше сжималась шапка инструментов (flex: 0 1 auto + overflow: auto,
       то есть минимальная ширина ноль), и на окне около тысячи пикселей
       начавшийся разговор молча срезал ей правый край вместе с «очистить» и
       счётчиком участников — причём доскроллить до него на тачскрине нельзя:
       body держит touch-action: none. Теперь место уступает ряд точек: он
       украшение, а не управление. Кнопки не сжимаются никогда (см. ниже). */
    /* Сжиматься панели разрешено — но только за счёт ряда точек (см. ниже).
       На узком телефоне с десятью страницами места ей иначе не хватает, и
       кнопки уезжали бы за край экрана: «положить трубку» становилась
       недосягаемой. */
    flex: 0 1 auto;
    /* Без этого сжатие не начнётся вовсе: у флекс-элемента собственный
       минимум по умолчанию равен содержимому, а содержимое тут — тот самый
       ряд точек, который и должен уступать место. */
    min-width: 0;
    /* Обе автополя разом: свободное место делится поровну слева и справа —
       это и есть «по центру» между страницами и инструментами. */
    margin-inline: auto;
    width: max-content;
    max-width: 100%;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }

  /* Когда слева в группе встают точки участников, «воздуха» внутри первой
     ячейки нет (точка — голый кружок 10px, а не кнопка 32px), и отступ до
     корпуса нужно отмерять от самой точки. Класс ставит voice.js: у :has()
     поддержка неровная, а состояние тут и так проходит через JS. */
  /* --tb-slack-end у .group выведен через var(--tb-slack), поэтому обнуление
     одного края уносило и второй: справа у панели по-прежнему стоит кнопка со
     своим «воздухом», и её отступ надо вернуть явно. */
  .voicebar.has-dots .group { --tb-slack: 0px; --tb-slack-end: var(--tb-slack-icon); }

  /* Что именно уступает место, когда его не хватает.
     Кнопки не сжимаются никогда, ряд точек — сколько угодно. Содержимое
     прижато к правому краю, а лишнее обрезается: значит вылезает и пропадает
     ряд точек СЛЕВА, а микрофон и трубка справа остаются целыми и нажимаемыми.
     Без justify-content: flex-end обрезалось бы наоборот — по правому краю,
     то есть ровно те кнопки, ради которых панель и существует. */
  .voicebar .group {
    min-width: 0;
    overflow: hidden;
    justify-content: flex-end;
  }

  .voicebar .btn {
    flex: 0 0 auto;
  }

  .voicebar .voice-dots {
    min-width: 0;
    flex: 0 1 auto;
  }

  /* .btn задаёт display: inline-grid, а .voice-dots — display: flex. Авторское
     правило перебивает hidden из таблицы браузера, поэтому и микрофон вне
     разговора, и пустой ряд точек остались бы видимыми. */
  .btn[hidden],
  .voice-dots[hidden] {
    display: none;
  }

  /* Две иконки в одной ячейке грида: состояние переключается классом, а не
     переписыванием разметки — метка <!--icon:...--> подставляется один раз, и
     градиенты внутри неё не задваиваются. */
  .btn.icon > .ico {
    grid-area: 1 / 1;
    display: block;
  }

  #callBtn .ico-call-end,
  #micBtn .ico-mic-off {
    display: none;
  }

  #callBtn.on .ico-call {
    display: none;
  }

  #callBtn.on .ico-call-end {
    display: block;
  }

  #micBtn.muted .ico-mic {
    display: none;
  }

  #micBtn.muted .ico-mic-off {
    display: block;
  }

  /* Кольцо вокруг микрофона — уровень собственного сигнала. Главный вопрос
     любого разговора «меня слышно?» отвечается ещё до того, как его задали.
     --lvl пишется инлайном пятнадцать раз в секунду: непрерывный сигнал в
     CSS-переход не укладывается, его ведут покадрово из JS, а короткий
     transition только сглаживает ступеньки. */
  .voice-mic {
    position: relative;
  }

  .voice-mic .voice-ring {
    position: absolute;
    inset: 3px;
    border-radius: 999px;
    box-shadow: 0 0 0 var(--lvl, 0px) rgba(16, 163, 127, 0.18);
    transition: box-shadow 90ms linear;
    pointer-events: none;
  }

  /* Уровень громкости — четыре полоски на месте обычной иконки. Ячейка та же,
     что у кнопки (var(--control)), поэтому ряд не дёргается, когда индикатор
     оживает. Высота полосок ведётся из JS через --lvl (0..1) покадрово: как и
     кольцо микрофона, непрерывный сигнал в CSS-переход не укладывается, а
     короткий transition только сглаживает ступеньки.
     Полоски разной чувствительности (--k) — тихая речь шевелит центральные,
     громкая поднимает все: иначе индикатор работал бы как лампочка «есть звук».
     Указатель сквозь него проходит: это показание, а не управление. */
  .voice-level {
    width: var(--control);
    height: var(--control);
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    /* До звонка показывать нечего — та же степень затемнения, что у
       отключённой кнопки (.btn:disabled), чтобы «неактивно» читалось одинаково
       у всех элементов панели. */
    opacity: 0.34;
    transition: opacity 160ms ease;
    pointer-events: none;
  }

  .voice-level.on {
    opacity: 1;
  }

  .voice-level i {
    display: block;
    width: 3px;
    border-radius: 999px;
    background: linear-gradient(180deg, #34D8B4, #10A37F);
    /* Минимум 4px: молчащий разговор — это ровный ряд точек, а не пустое место
       (пустое место нельзя отличить от сломанного индикатора). */
    height: calc(4px + var(--lvl, 0) * var(--k) * 15px);
    transition: height 90ms linear;
  }

  .voice-level i:nth-child(1) { --k: 0.45; }
  .voice-level i:nth-child(2) { --k: 0.82; }
  .voice-level i:nth-child(3) { --k: 1; }
  .voice-level i:nth-child(4) { --k: 0.6; }

  /* Разговор идёт, а меня в нём нет: медленный ореол — приглашение, не тревога. */
  @keyframes voice-live {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16, 163, 127, 0.30); }
    60%      { box-shadow: 0 0 0 7px rgba(16, 163, 127, 0); }
  }

  #callBtn.live:not(.on) {
    border-radius: 999px;
    animation: voice-live 2.2s ease-out infinite;
  }

  #callBtn.pending {
    cursor: default;
  }

  .voice-dots {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Цвет точки — цвет курсора того же человека (--peer ставит voice.js). */
  .voice-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--peer, var(--accent));
    box-shadow: 0 0 0 var(--lvl, 0px) var(--peer-soft, rgba(16, 163, 127, 0.30));
    transition: box-shadow 90ms linear, opacity 140ms ease;
  }

  /* Замолчал — заливка; выключил микрофон — только контур. «Звука нет вовсе»
     обязано читаться иначе, чем «сейчас молчит». */
  .voice-dot.muted {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--peer, var(--accent));
  }

  .voice-dot.away {
    opacity: 0.34;
  }

  .voice-dot.lost {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--danger);
  }

  .voice-more {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Единственная бесконечная анимация в проекте — и единственное место, где
     уважение к системной настройке движения обязательно. */
  @media (prefers-reduced-motion: reduce) {
    #callBtn.live:not(.on) {
      animation: none;
      box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.28);
    }

    .voice-dot,
    .voice-level i,
    .voice-mic .voice-ring {
      transition: none;
    }
  }

  .vbar {
    position: fixed;
    z-index: 12;
    /* Дорожка идёт по столу вдоль правой кромки листа и повторяет его высоту
       ровно: положение бегунка читается как окно, вырезанное из страницы. */
    top: var(--top-reserve);
    right: var(--side-reserve);
    bottom: var(--bottom-reserve);
    width: var(--scroll-w);
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    opacity: 1;
    pointer-events: auto;
  }

  .thumb {
    position: absolute;
    left: 2px;
    right: 2px;
    min-height: 28px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.34);
    cursor: grab;
    touch-action: none;
  }

  .thumb:active {
    cursor: grabbing;
  }

  .eraser-cursor {
    position: absolute;
    /* Выше плавающих окон: ластиком работают и внутри них, а кольцо должно
       показывать размер пятна и там. */
    z-index: 14;
    width: 28px;
    height: 28px;
    border: 1.5px solid #a6425b;
    border-radius: 50%;
    background-color: #d17f8f;
    
    background-size: 8px 8px, 9px 9px, 11px 11px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.88),
      inset 0 1px 2px rgba(255, 238, 242, 0.72),
      inset 0 -1px 2px rgba(122, 38, 59, 0.24);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 80ms ease;
  }

  .eraser-cursor.show {
    opacity: 1;
  }

  .toast {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: calc(var(--bottom-reserve) + 12px);
    max-width: min(420px, calc(100vw - 32px));
    transform: translate(-50%, 12px);
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel-solid);
    box-shadow: var(--shadow);
    color: var(--text);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- Плавающие окна ---
     Маленький холст поверх листа: пишут в нём теми же инструментами, что и на
     доске. Слой НЕ участвует в прокрутке — камера уезжает, окно остаётся на том
     же месте экрана, причём у всех участников в одной и той же его части
     (единицы координат — см. normalizeNote в storage.js). */
  .notes {
    position: absolute;
    inset: 0;
    z-index: 12;
    pointer-events: none;
  }

  /* Ширину и высоту получает только холст внутри, а корпус обтекает его сам:
     рамка и шапка не входят в мировые размеры окна. */
  .note {
    position: absolute;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel-solid);
    box-shadow: var(--shadow);
    cursor: default;
    pointer-events: auto;
    transition: border-color 140ms ease, box-shadow 140ms ease;
  }

  .note.dragging {
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.16), 0 3px 12px rgba(0, 0, 0, 0.07);
  }

  .note-canvas {
    display: block;
    /* Жесты браузера (прокрутка, зум) здесь не нужны: холст ведёт линию. */
    touch-action: none;
    cursor: crosshair;
  }

  .stage.erase .note-canvas {
    cursor: none;
  }

  .stage.lasso .note-canvas {
    cursor: default;
  }

  /* Шапка — единственное место, за которое окно двигают: внутри текста жест
     принадлежит выделению, а не перетаскиванию. */
  .note-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 4px 0 9px;
    border-bottom: 1px solid var(--line);
    background: rgba(21, 21, 21, 0.045);
    cursor: grab;
    touch-action: none;
  }

  .note.dragging .note-bar {
    cursor: grabbing;
  }

  .note-grip {
    flex: 1;
    height: 9px;
    background-image: radial-gradient(circle, var(--line-strong) 1px, transparent 1.15px);
    background-size: 6px 5px;
    opacity: 0.75;
  }

  .note-close {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }

  .note-close:hover {
    background: rgba(207, 46, 46, 0.12);
    color: var(--danger);
  }

  .note-close svg {
    display: block;
    width: 12px;
    height: 12px;
  }

  .note-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 20px;
    cursor: nwse-resize;
    touch-action: none;
  }

  /* Уголок-«уголок»: две насечки, как у ручки изменения размера картинки. */
  .note-resize::after {
    content: "";
    position: absolute;
    right: 4px;
    bottom: 4px;
    width: 9px;
    height: 9px;
    border-right: 1.5px solid var(--line-strong);
    border-bottom: 1.5px solid var(--line-strong);
    border-bottom-right-radius: 3px;
  }

  /* Панель страниц (блокнот) — слева, в стиле основного toolbar. */
  .pagebar {
    order: 1;
    flex: 0 0 auto;
    width: max-content;
    max-width: 100%;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }

  .page-indicator {
    /* Счётчик залит фоном во всю ширину — «воздуха» внутри бокса у него нет,
       поэтому зазор до стрелок добирается собственным полем. */
    margin-inline: calc(var(--tb-item) + var(--tb-slack-icon));
    min-width: 44px;
    min-height: var(--control);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    user-select: none;
  }

  .page-indicator.pulse {
    animation: page-pulse 0.45s ease;
  }

  @keyframes page-pulse {
    from { transform: scale(1.34); }
    to { transform: scale(1); }
  }

  /* На последнем листе стрелка «вперёд» не гаснет, а заводит новый лист:
     об этом говорит верхний индекс «+» у её кончика. Отдельной кнопки
     «добавить страницу» в блокноте нет — эта роль ушла на стрелку.
     Крестик нарисован двумя полосками, а не глифом шрифта: так он остаётся
     чётким на любом DPI и совпадает по скруглению со штрихами иконок. */
  #nextPageBtn {
    position: relative;
  }

  .page-next-plus {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 8px;
    height: 8px;
    opacity: 0;
    transform: scale(0.4);
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.18));
    pointer-events: none;
    transition: opacity 140ms ease, transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .page-next-plus::before,
  .page-next-plus::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 999px;
    background: var(--accent);
    transform: translate(-50%, -50%);
  }

  .page-next-plus::before {
    width: 8px;
    height: 2px;
  }

  .page-next-plus::after {
    width: 2px;
    height: 8px;
  }

  #nextPageBtn.can-add .page-next-plus {
    opacity: 1;
    transform: scale(1);
  }

  /* Индекс подхватывает подъём иконки на наведении — они читаются как один глиф. */
  #nextPageBtn.can-add:hover .page-next-plus {
    transform: translateY(-1px);
  }

  /* --- Быстрая панель ---
     Плавающая палитра на шесть ячеек: сверху ластик и два маркера, снизу три
     пера — те же кнопки, что и в основном toolbar, просто под рукой. Панель
     живёт поверх листа, двигается за ползунок и встаёт только в узлы сетки:
     позиций конечное число, поэтому панель не «плавает» на пиксель мимо.
     Область хода — от левой кромки листа до правой и ниже toolbar; JS считает
     её по самим панелям, чтобы быстрая палитра не наезжала на них сверху.
     Положение и свёрнутость переживают перезагрузку (localStorage). */
  .quickbar {
    --qb-cell: 38px;
    position: fixed;
    z-index: 24;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    /* До первой раскладки координат ещё нет — панель не должна мигнуть в углу. */
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, box-shadow 140ms ease, transform 140ms ease;
  }

  .quickbar.ready {
    opacity: 1;
    pointer-events: auto;
  }

  /* Приземление после броска: единственная фаза, где координаты едут плавно.
     Во время перетаскивания transition выключен — иначе панель отстаёт от
     пальца, а магнит к узлу перестаёт читаться как щелчок. */
  .quickbar.settling {
    transition: left 190ms cubic-bezier(0.22, 1, 0.36, 1),
                top 190ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 160ms ease, box-shadow 140ms ease, transform 140ms ease;
  }

  .quickbar.dragging {
    box-shadow: 0 26px 60px rgba(0, 0, 0, 0.16), 0 3px 12px rgba(0, 0, 0, 0.07);
    transform: scale(1.03);
  }

  /* Ползунок: единственное место, за которое панель тянут. Насечка та же, что
     у шапки плавающего окна, — жест читается одинаково во всём интерфейсе. */
  .quick-grip {
    display: flex;
    align-items: center;
    gap: 4px;
    /* Ползунок берут пальцем и пером наравне с кнопками, поэтому зона нажатия
       у него выше самой насечки: тянут за всю полосу, а не за точки. */
    height: 20px;
    padding-inline: 3px;
    cursor: grab;
    touch-action: none;
  }

  .quickbar.dragging .quick-grip {
    cursor: grabbing;
  }

  .quick-grip-dots {
    flex: 1;
    height: 9px;
    background-image: radial-gradient(circle, var(--line-strong) 1px, transparent 1.15px);
    background-size: 6px 5px;
    opacity: 0.75;
  }

  .quick-fold {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }

  .quick-fold:hover {
    background: rgba(21, 21, 21, 0.075);
    color: var(--text);
  }

  .quick-fold:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 1px;
  }

  /* Шеврон нарисован двумя гранями квадрата — как «плюс» у стрелки страниц:
     чётко на любом DPI и скругляется теми же 1.6px, что штрихи иконок. */
  .quick-chevron {
    width: 6px;
    height: 6px;
    margin-top: 2px;
    border-left: 1.6px solid currentColor;
    border-top: 1.6px solid currentColor;
    transform: rotate(45deg);
    transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .quickbar.folded .quick-chevron {
    margin-top: -2px;
    transform: rotate(225deg);
  }

  /* Свёрнутая панель не исчезает совсем: остаётся пилюля-ползунок — за неё её
     и возвращают, и двигают дальше. Иначе панель было бы нечем позвать назад. */
  .quickbar.folded {
    border-radius: 999px;
  }

  .quickbar.folded .quick-body {
    display: none;
  }

  .quickbar.folded .quick-grip {
    width: 66px;
  }

  /* Ряды строго по три ячейки: ластик и маркеры сверху, перья снизу. Наборы
     свотчей раскрываются в ту же сетку (display: contents), поэтому строка
     каждого инструмента задаётся явно и не съедет, если цветов вдруг меньше. */
  .quick-body {
    display: grid;
    grid-template-columns: repeat(3, var(--qb-cell));
    gap: var(--tb-item);
  }

  .quick-body .swatches {
    display: contents;
  }

  .quickbar .quick-body .btn.icon,
  .quickbar .quick-body .swatch {
    width: var(--qb-cell);
    height: var(--qb-cell);
  }

  #quickEraserBtn {
    grid-area: 1 / 1;
  }

  #quickHlColors .swatch {
    grid-row: 1;
  }

  #quickPenColors .swatch {
    grid-row: 2;
  }

  .quickbar .quick-body .swatch .dot {
    width: 28px;
    height: 23px;
    border-radius: 9px;
  }

  /* Узлы сетки проступают только на время перетаскивания: пока панель несут,
     видно, куда именно она может встать, а в покое поле пустое. Точки стоят
     там, где окажется центр панели, — поэтому и сама сетка выглядит как ряд
     посадочных мест, а не как разметка под угол корпуса. */
  .quick-grid-hint {
    position: fixed;
    z-index: 23;
    opacity: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, var(--line-strong) 1.6px, transparent 2.1px);
    transition: opacity 150ms ease;
  }

  .quick-grid-hint.show {
    opacity: 0.55;
  }

  /* Резинка листа: пока прокрутку продолжают за конец страницы, лист (и его
     край) отъезжают на --pull, а отпущенный жест возвращает их пружиной. */
  .stage.pulling > canvas,
  .stage.pulling .page-edge {
    transform: translateY(var(--pull, 0px));
  }

  /* Край листа — тонкая линия с мягкой тенью: видно, что бумага кончилась
     и её тянут за край. Позицию задаёт JS, она едет вместе с холстом. */
  .page-edge {
    position: absolute;
    z-index: 4;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(21, 21, 21, 0) 0%,
      rgba(21, 21, 21, 0.15) 14%,
      rgba(21, 21, 21, 0.15) 86%,
      rgba(21, 21, 21, 0) 100%);
    box-shadow: 0 7px 16px -7px rgba(0, 0, 0, 0.26);
    opacity: 0;
    pointer-events: none;
  }

  /* Индикатор продолжения: всплывает у края листа, когда прокрутку продолжают
     дальше конца страницы, и заполняется кольцом, пока усилие удерживают. */
  .page-hint {
    position: fixed;
    z-index: 25;
    left: 50%;
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 58px);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 14px 6px 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    color: var(--text);
    font-size: 13px;
    font-weight: 570;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, 14px);
    pointer-events: none;
  }

  .page-hint.top {
    bottom: auto;
    top: calc(var(--top-reserve) + 14px);
  }

  .page-hint svg {
    display: block;
    width: 26px;
    height: 26px;
    overflow: visible;
  }

  .hint-plus {
    display: none;
  }

  .page-hint.create .hint-plus {
    display: block;
  }

  .page-hint.create .hint-arrow {
    display: none;
  }

  .page-hint.top .hint-arrow {
    transform: rotate(180deg);
    transform-origin: 12px 12px;
  }

  /* Фолбэк пружинного «попа» при нажатии, если GSAP не загрузился. */
  .tap-pop {
    animation: tap-pop-kf 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes tap-pop-kf {
    from { transform: scale(0.8); }
    to { transform: scale(1); }
  }

  /* Тулбар и блокнот делят верхнюю строку, и оба имеют фиксированную ширину.
     Порог — момент, когда они перестают помещаться рядом: дальше блокнот
     уезжает вниз-влево, иначе он наезжает на цвета пера. */
  /* Порог был рассчитан на две панели в верхней полосе. Их стало три, и на
     окне около тысячи пикселей начавшийся разговор переставал помещаться:
     место уступала шапка инструментов — молча срезала себе правый край вместе
     с «очистить» и счётчиком участников, причём доскроллить до них пальцем
     нельзя (body держит touch-action: none). Панель страниц уезжает вниз
     раньше — у неё внизу давно есть законное место, и там она никому не мешает,
     а разговор остаётся сверху по центру, как и задумано.
     1060 = самая широкая шапка (622) + самая широкая панель разговора на шестерых
     (157) + панель страниц (190) + два зазора (24) + поля листа (32), с запасом. */
  @media (max-width: 1060px) {
    /* Блокнот всплывает над листом, а не садится на его кромку: нижняя граница
       бумаги и запечённый угол остаются видны. */
    .pagebar {
      position: fixed;
      z-index: 20;
      top: auto;
      left: var(--paper-left);
      bottom: calc(var(--bottom-reserve) + 12px);
    }
  }

  @media (max-width: 760px) {
    :root {
      --control: 31px;
      /* --top-reserve и --chrome-h пересчитаются сами: они выражены через
         --chrome-top, --control и --tb-pad. */
      --chrome-top: max(8px, env(safe-area-inset-top));
      --side-reserve: max(8px, env(safe-area-inset-left), env(safe-area-inset-right));
      --bottom-reserve: max(8px, env(safe-area-inset-bottom));
      --paper-radius: 14px;
      /* Ступени поджимаются, но их порядок сохраняется: сосед < набор < группа. */
      --tb-pad: 5px;
      --tb-set: 6px;
      --tb-group: 12px;
    }

    .btn {
      padding: 0 8px;
      font-size: 12px;
    }


    /* На узких экранах уводим панель страниц вниз-влево, чтобы не пересекаться
       с основным toolbar сверху. */
    .pagebar {
      bottom: calc(var(--bottom-reserve) + 10px);
    }

    /* Наверху на телефоне места нет вовсе — шапка инструментов занимает всю
       ширину. Разговор уходит вниз-вправо, ровно напротив страниц: нижняя
       полоса читается как «страницы слева, разговор справа». */
    /* Наверху на телефоне места нет вовсе — шапка инструментов занимает всю
       ширину. Поэтому вниз уезжает ВСЯ полоса целиком: страницы слева,
       разговор справа. Двумя независимыми position: fixed панелями это делать
       нельзя — они ничего не знают друг о друге и в разговоре втроём на
       320-360 px наезжают одна на другую (панель страниц рисуется поверх и
       забирает касания). Во флекс-полосе перекрытие невозможно по построению:
       не хватило места — сжимается ряд точек. */
    .chrome-band {
      top: auto;
      bottom: calc(var(--bottom-reserve) + 10px);
      justify-content: space-between;
    }

    /* Шапка инструментов покидает полосу и остаётся наверху — ровно там же,
       где была до появления полосы. */
    .toolbar {
      position: fixed;
      z-index: 20;
      top: var(--chrome-top);
      right: var(--paper-right);
      max-width: calc(100vw - var(--paper-left) - var(--paper-right));
    }

    /* Страницы возвращаются в полосу: теперь она сама внизу. */
    .pagebar {
      position: static;
    }

    /* Прижат к правому краю полосы через space-between, автополя тут мешают. */
    .voicebar {
      margin-inline: 0;
    }

    /* Индикатор не должен налезать ни на toolbar сверху, ни на панель страниц снизу. */
    .page-hint {
      bottom: calc(max(8px, env(safe-area-inset-bottom)) + 62px);
    }

    .page-hint.top {
      top: calc(var(--top-reserve) + 10px);
    }
  }
</style>
</head>
<body>
<main class="app" aria-label="onCanvas">
  <section id="stage" class="stage" aria-label="Рабочая область доски">
    <canvas id="back"></canvas>
    <canvas id="ink"></canvas>
    <canvas id="overlay"></canvas>
    <div id="pageEdge" class="page-edge" aria-hidden="true"></div>
    <div id="notes" class="notes"></div>
    <div id="eraserCursor" class="eraser-cursor" aria-hidden="true"></div>
    <div id="vbar" class="vbar" aria-hidden="true">
      <div id="thumb" class="thumb"></div>
    </div>
  </section>

  <!-- Порядок в разметке — шапка, разговор, страницы; порядок на экране задаёт
       CSS (order). Так последовательность обхода с клавиатуры остаётся прежней:
       сначала инструменты рисования, которыми пользуются постоянно. -->
  <div class="chrome-band">
  <header class="toolbar" aria-label="Инструменты доски">
    <div class="group colors pen-colors" aria-label="Цвета ручки">
      <span class="group-label">Перо</span>
      <div id="penColors" class="swatches" data-swatches="pen"></div>
    </div>

    <div class="group colors" aria-label="Цвета маркера">
      <span class="group-label">Маркер</span>
      <div id="hlColors" class="swatches" data-swatches="hl"></div>
    </div>

    <div class="group tools" aria-label="Инструменты">
      <button id="lassoBtn" class="btn icon" type="button" aria-pressed="false" aria-label="Лассо" title="Лассо (L)">
        <!--icon:lasso-->
      </button>
      <button id="eraserBtn" class="btn icon" data-act="eraser" type="button" aria-pressed="false" aria-label="Ластик" title="Ластик (E)">
        <!--icon:eraser-->
      </button>
      <div id="sizes" class="sizes set-start" aria-label="Толщина линии"></div>
    </div>

    <div class="group" aria-label="Вставка">
      <button id="noteBtn" class="btn icon" type="button" aria-label="Добавить плавающее окно" title="Плавающее окно (N)">
        <!--icon:note-->
      </button>
      <button id="imgBtn" class="btn icon" type="button" aria-label="Добавить изображение" title="Добавить изображение">
        <!--icon:image-->
      </button>
      <button id="exportBtn" class="btn icon" type="button" aria-label="Скачать PDF (все страницы)" title="Скачать PDF (все страницы)">
        <!--icon:export-->
      </button>
    </div>

    <div class="group" aria-label="История">
      <button id="undoBtn" class="btn icon" type="button" title="Отменить (Ctrl/Cmd+Z)" disabled aria-label="Отменить">
        <!--icon:undo-->
      </button>
      <button id="redoBtn" class="btn icon" type="button" title="Повторить (Ctrl/Cmd+Y)" disabled aria-label="Повторить">
        <!--icon:redo-->
      </button>
      <button id="clearBtn" class="btn icon danger set-start" type="button" aria-label="Очистить страницу" title="Очистить страницу">
        <!--icon:clear-->
      </button>
    </div>

    <div class="group status" aria-label="Статус">
      <button id="presenceBtn" class="presence" type="button" title="Обновить страницу" aria-label="Обновить страницу">
        <span class="presence-dot" aria-hidden="true"></span>
        <span id="userCount">0</span>
        <span class="sr-only">онлайн</span>
      </button>
    </div>
  </header>

  <!-- Разговор живёт своей панелью, а не в шапке инструментов: рисование и
       разговор — разные занятия, и держать «положить трубку» вплотную к выбору
       пера незачем. Корпус тот же, что у шапки и у панели страниц, поэтому
       третья панель читается как часть одного набора, а не как чужая деталь. -->
  <nav id="voicebar" class="voicebar" aria-label="Разговор">
    <div class="group" aria-label="Управление разговором">
      <!-- Точки участников разговора: цвет тот же, что у курсора этого человека,
           — кто рисует и кого слышно читается одним взглядом. Живой регион здесь
           был бы невыносим (пульс на каждое слово), поэтому изменения состава
           уходят в #voiceStatus. -->
      <div id="voiceDots" class="voice-dots" aria-hidden="true" hidden></div>
      <!-- Уровень громкости разговора: насколько громко сейчас звучат остальные.
           Стоит первым и никуда не исчезает — панель разговора имеет один и тот
           же вид до звонка и во время него, а «затемнён» читается как «пока
           нечего показывать», в отличие от появляющейся из ниоткуда кнопки,
           которая на каждый звонок заново перекраивает ряд под пальцем. -->
      <div id="voiceLevel" class="voice-level" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
      <button id="micBtn" class="btn icon voice-mic" type="button" aria-pressed="false"
              aria-label="Выключить микрофон" title="Выключить микрофон (M)" disabled>
        <span class="voice-ring" aria-hidden="true"></span>
        <span class="ico ico-mic"><!--icon:mic--></span>
        <span class="ico ico-mic-off"><!--icon:mic-off--></span>
      </button>
      <button id="callBtn" class="btn icon" type="button" aria-pressed="false"
              aria-label="Начать разговор" title="Начать разговор">
        <span class="ico ico-call"><!--icon:call--></span>
        <span class="ico ico-call-end"><!--icon:call-end--></span>
      </button>
      <span id="voiceStatus" class="sr-only" role="status" aria-live="polite"></span>
    </div>
  </nav>

  <nav id="pagebar" class="pagebar" aria-label="Страницы">
    <div class="group" aria-label="Навигация по страницам">
      <button id="prevPageBtn" class="btn icon" type="button" aria-label="Предыдущая страница" title="Предыдущая страница ([)">
        <!--icon:page-prev-->
      </button>
      <span id="pageIndicator" class="page-indicator" aria-live="polite" title="Текущая страница / всего">1/1</span>
      <button id="nextPageBtn" class="btn icon" type="button" aria-label="Следующая страница" title="Следующая страница (])">
        <!--icon:page-next-->
        <span class="page-next-plus" aria-hidden="true"></span>
      </button>
    </div>

    <div class="group" aria-label="Управление страницами">
      <button id="delPageBtn" class="btn icon" type="button" aria-label="Удалить страницу" title="Удалить страницу">
        <!--icon:page-del-->
      </button>
    </div>
  </nav>
  </div>

  <!-- Быстрая панель: та же палитра, что в toolbar, но под рукой — плавает над
       листом, таскается за ползунок и сворачивается в пилюлю. Строки: ластик +
       два маркера, затем три пера. Кнопки помечены data-атрибутами: tools.js
       собирает и подсвечивает свотчи сразу во всех панелях по ним. -->
  <aside id="quickbar" class="quickbar" aria-label="Быстрая панель инструментов">
    <div id="quickGrip" class="quick-grip" title="Перетащить панель">
      <span class="quick-grip-dots" aria-hidden="true"></span>
      <button id="quickFoldBtn" class="quick-fold" type="button" aria-expanded="true" aria-controls="quickBody" aria-label="Свернуть быструю панель" title="Свернуть панель (Q)">
        <span class="quick-chevron" aria-hidden="true"></span>
      </button>
    </div>
    <div id="quickBody" class="quick-body">
      <button id="quickEraserBtn" class="btn icon" data-act="eraser" type="button" aria-pressed="false" aria-label="Ластик" title="Ластик (E)">
        <!--icon:eraser-->
      </button>
      <div id="quickHlColors" class="swatches" data-swatches="hl" role="group" aria-label="Цвета маркера"></div>
      <div id="quickPenColors" class="swatches" data-swatches="pen" role="group" aria-label="Цвета ручки"></div>
    </div>
  </aside>

  <!-- Поле посадочных мест быстрой панели: видно только пока её несут. -->
  <div id="quickGridHint" class="quick-grid-hint" aria-hidden="true"></div>

  <div id="pageHint" class="page-hint" aria-hidden="true">
    <!--icon:page-hint-->
    <span id="pageHintLabel" class="page-hint-label">Новая страница</span>
  </div>

  <input id="fileInput" class="sr-only" type="file" accept="image/*">
  <!-- Приёмники удалённого звука. Именно .sr-only, а не display:none: скрытый
       через display аудиоэлемент часть браузеров перестаёт играть. -->
  <div id="voiceSinks" class="sr-only" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Заготовка плавающего окна: разметка живёт здесь (и иконка подставляется
       так же, как в тулбарах), а notes.js только клонирует её на каждое окно. -->
  <template id="noteTpl">
    <div class="note">
      <div class="note-bar">
        <span class="note-grip" aria-hidden="true"></span>
        <button class="note-close" type="button" aria-label="Удалить окно" title="Удалить окно">
          <!--icon:note-close-->
        </button>
      </div>
      <canvas class="note-canvas" aria-label="Холст плавающего окна"></canvas>
      <span class="note-resize" aria-hidden="true"></span>
    </div>
  </template>
</main>

<script type="module">
import { BoardStorage } from './storage.js';
import { CanvasRenderer } from './canvas.js';
import { NetworkManager } from './network.js';
import { HistoryManager } from './history.js';
import { ToolManager } from './tools.js';
import { NotesManager } from './notes.js';
import { VoiceManager } from './voice.js';

(function() {
  "use strict";

  const storage = new BoardStorage();

  const renderer = new CanvasRenderer(storage);
  // Удалённые операции и undo/redo только помечают кадр «грязным» —
  // фактическая перерисовка коалесится в один вызов на animation frame.
  const network = new NetworkManager(
    storage,
    () => renderer.scheduleRender(),
    (point) => renderer.focusWorldPoint(point)
  );
  network.onRemoteCursor = (clientId, point) => renderer.setRemoteCursor(clientId, point);
  const history = new HistoryManager(storage, network, () => renderer.scheduleRender());
  const tools = new ToolManager(storage, renderer, network, history);
  // Плавающие окна — маленькие холсты поверх листа: пишут в них теми же
  // инструментами, но к экрану они приклеены, а не к бумаге, поэтому камера их
  // не двигает.
  const notes = new NotesManager(storage, renderer, network, history, tools);
  // Участник ушёл на другой лист и начал там писать — уводим за ним остальных.
  network.onRemotePage = (pageId, point) => tools.followRemotePage(pageId, point);

  // Разговор поверх доски: свой полносвязный меш, но сигналинг едет тем же
  // сокетом и мимо состояния доски. Подключается ДО network.init(): состав
  // разговора приходит сразу за presence, ещё до первого нарисованного штриха.
  const voice = new VoiceManager(storage, network, renderer);
  network.onVoiceMessage = (msg) => voice.handleMessage(msg);
  network.onSocketOpen = () => voice.onSocketOpen();
  voice.init();

  document.getElementById('presenceBtn')?.addEventListener('click', () => {
    // Во время разговора перезагрузка обрывает связь всем, кто нас слушает, —
    // просим подтвердить вторым нажатием.
    if (voice.guardReload()) return;
    window.location.reload();
  });

  network.init();

  // Expose globally for testing/debugging
  window._board = { storage, renderer, network, history, tools, notes, voice };
})();
</script>
</body>
</html>
