<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>onCanvas</title>
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=3" sizes="16x16" type="image/png">
<link rel="alternate icon" href="/favicon.ico?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#ffffff">
<!-- GSAP (локально) — плавные переходы между страницами. Классический скрипт
     грузится до отложенного модуля, поэтому window.gsap доступен в tools.js. -->
<script src="/gsap.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --app-bg: #f7f8f7;
    --paper: #ffffff;
    --text: #151515;
    --muted: #6b6f6d;
    --line: rgba(21, 21, 21, 0.11);
    --line-strong: rgba(21, 21, 21, 0.18);
    --panel: rgba(255, 255, 255, 0.86);
    --panel-solid: #ffffff;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.10), 0 2px 10px rgba(0, 0, 0, 0.05);
    --accent: #10a37f;
    --accent-soft: rgba(57, 77, 254, 0.13);
    --accent-line: rgba(57, 77, 254, 0.25);
    --danger: #cf2e2e;
    --ui-strong: #151515;
    --radius: 8px;
    --control: 32px;

    /* Шкала отступов тулбаров.
       Считаем расстояния между «чернилами» — видимыми глифами, а не между
       боксами кнопок: тап-цель у всех одна (--control), а глиф внутри разный
       (точка пера 18px, скос маркера 12px, иконка 21px, залитая пилюля — во
       всю ширину). Один и тот же gap давал бы на вид разные зазоры, поэтому
       отступы корректируются на «воздух» внутри тап-цели — --tb-slack-*.
       Три ступени, каждая заметно крупнее предыдущей:
         сосед по набору ~15px → соседний набор ~22px → соседняя группа 28px. */
    --tb-pad: 6px;      /* внутренний отступ корпуса панели */
    --tb-item: 2px;     /* зазор между тап-целями внутри набора */
    --tb-set: 7px;      /* добавка на границе наборов внутри одной группы */
    --tb-group: 14px;   /* от разделителя до глифа — поровну с обеих сторон */
    /* Отступ от корпуса до глифа равен вертикальному: панель обтекает кнопки
       одинаково со всех сторон. */
    --tb-edge: calc(var(--tb-pad) + var(--tb-slack-dot));
    --tb-slack-dot: calc((var(--control) - 18px) / 2);      /* точка пера / размер */
    --tb-slack-icon: calc((var(--control) - 21px) / 2);     /* иконка */

    /* Запас сверху: холст начинается ниже панели инструментов, чтобы toolbar
       не перекрывал то, что можно нарисовать у верхнего края. */
    --top-reserve: calc(max(18px, env(safe-area-inset-top)) + var(--control) + 18px);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--app-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  button,
  input {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    position: fixed;
    inset: 0;
    /* Полоса запаса над холстом — того же цвета, что бумага, без шва. */
    background: var(--paper);
  }

  .stage {
    position: absolute;
    inset: var(--top-reserve, 0px) 0 0 0;
    overflow: hidden;
    background: var(--paper);
    cursor: crosshair;
  }

  .stage.erase {
    cursor: none;
  }

  .stage.lasso {
    cursor: default;
  }

  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #back {
    z-index: 1;
    background: var(--paper);
  }

  #ink {
    z-index: 2;
    pointer-events: none;
  }

  #overlay {
    z-index: 3;
    touch-action: none;
  }

  .toolbar {
    position: fixed;
    z-index: 20;
    top: max(18px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: max-content;
    max-width: calc(100vw - 24px);
    display: flex;
    align-items: stretch;
    /* Весь горизонтальный воздух между группами живёт в padding самих групп —
       так разделитель оказывается ровно посередине зазора. */
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .toolbar::-webkit-scrollbar {
    display: none;
  }

  .group {
    /* Чем заполнены края группы — от этого зависит, сколько «воздуха» кнопка
       приносит с собой и сколько отступа нужно добавить. Края считаются
       отдельно: слева у группы может стоять иконка, а справа — точка. */
    --tb-slack: var(--tb-slack-icon);
    --tb-slack-end: var(--tb-slack);
    display: flex;
    align-items: center;
    gap: var(--tb-item);
    min-width: max-content;
    padding-inline-start: calc(var(--tb-group) - var(--tb-slack));
    padding-inline-end: calc(var(--tb-group) - var(--tb-slack-end));
    border-right: 1px solid var(--line);
  }

  .group.colors { --tb-slack: var(--tb-slack-dot); }
  .group.tools { --tb-slack-end: var(--tb-slack-dot); }  /* справа — «размеры» */
  .group.status { --tb-slack: 0px; }

  /* Крайние группы прижимаются к корпусу панели, а не к соседу, поэтому у них
     внешний отступ считается от --tb-edge, а не от --tb-group. */
  .group:first-child {
    padding-inline-start: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack)));
  }

  .group:last-child {
    padding-inline-end: max(0px, calc(var(--tb-edge) - var(--tb-pad) - var(--tb-slack-end)));
    border-right: 0;
  }

  /* Начало нового набора внутри группы: ступень заметнее, чем между соседями,
     но мельче, чем через разделитель. Ею же отодвигаются разрушающие действия
     (очистить страницу, удалить страницу) — чтобы не попасть в них промахом. */
  .set-start {
    margin-inline-start: var(--tb-set);
  }

  .group-label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .swatches,
  .sizes,
  .segmented {
    display: flex;
    align-items: center;
    gap: var(--tb-item);
  }

  .btn,
  .swatch,
  .size {
    width: var(--control);
    height: var(--control);
    border: 1px solid transparent;
    border-radius: 999px;
    display: inline-grid;
    place-items: center;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
  }

  .btn {
    padding: 0 10px;
    width: auto;
    min-width: var(--control);
    font-size: 13px;
    font-weight: 570;
    white-space: nowrap;
  }

  .btn.icon {
    width: var(--control);
    padding: 0;
    font-size: 16px;
  }

  .btn.icon .m-icon {
    width: 21px;
    height: 21px;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.18));
    transition: transform 140ms ease, filter 140ms ease;
  }

  #eraserBtn .m-icon {
    width: 24px;
    height: 24px;
  }

  #eraserBtn,
  #lassoBtn {
    position: relative;
  }

  #eraserBtn .tool-index,
  #lassoBtn .tool-index {
    position: absolute;
    bottom: 1px;
    right: 2px;
    color: var(--text);
    font-size: 8px;
    font-weight: 700;
    line-height: 1;
  }

  .btn.icon:hover .m-icon,
  .btn.icon.on .m-icon {
    transform: translateY(-1px);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
  }

  .btn.icon:disabled .m-icon {
    filter: grayscale(0.75) opacity(0.55);
  }

  .m-edge {
    stroke: rgba(29, 34, 32, 0.22);
    stroke-width: 1;
  }

  .m-highlight {
    fill: rgba(255, 255, 255, 0.62);
  }

  .btn:hover {
    background: rgba(21, 21, 21, 0.055);
  }

  .btn:focus-visible,
  .swatch:focus-visible,
  .size:focus-visible {
    outline: 2px solid var(--accent-line);
    outline-offset: 2px;
  }

  .btn.on {
    border-color: var(--accent-line);
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px rgba(16, 163, 127, 0.08);
  }

  .btn:active,
  .swatch:active,
  .size:active {
    transform: translateY(1px);
  }

  .btn:disabled {
    opacity: 0.34;
    cursor: default;
    transform: none;
  }

  .btn.danger {
    color: var(--danger);
  }

  .swatch {
    padding: 0;
  }

  .size {
    border-radius: 8px;
  }

  .swatch .dot {
    width: 18px;
    height: 18px;
    border-radius: 7px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    transition: box-shadow 120ms ease, transform 120ms ease;
  }

  /* Скос маркера узкий — 12px против 18px у точки пера. При одинаковых боксах
     пара «жёлтый/фиолетовый» разъехалась бы на вид сильнее, чем расходятся
     целые группы, поэтому лишние 6px «воздуха» срезаны с бокса: оптический
     зазор внутри набора получается тот же, что у пера. Высота тап-цели —
     а с ней и удобство попадания сверху пером — не меняется. */
  .swatch.hl {
    width: calc(var(--control) - 6px);
  }

  .swatch.hl .dot {
    width: 25px;
    height: 20px;
    border-radius: 6px;
  }

  .swatch:hover .dot {
    box-shadow:
      0 0 0 5px rgba(21, 21, 21, 0.055),
      inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }

  .swatch.sel .dot {
    box-shadow:
      0 0 0 5px var(--accent-line),
      inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }

  .size .pip {
    position: relative;
    width: 18px;
    height: 18px;
    display: inline-block;
    border-radius: 7px;
    background: var(--text);
    color: var(--panel-solid);
    transition: box-shadow 120ms ease, transform 120ms ease;
  }

  .size .pip sub {
    position: absolute;
    z-index: 1;
    right: -3px;
    bottom: -3px;
    color: var(--text);
    font-size: 11px;
    font-weight: 800;
    line-height: 1;
    -webkit-text-stroke: 1px var(--panel-solid);
    filter: drop-shadow(0 0 1px rgba(21, 21, 21, 0.9));
  }

  .size:hover .pip {
    box-shadow: 0 0 0 7px rgba(21, 21, 21, 0.055);
  }

  .size.sel .pip {
    box-shadow:
      0 0 0 4px var(--accent-line);
  }

  .presence {
    border: 0;
    min-height: var(--control);
    min-width: 58px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    color: var(--muted);
    font-size: 13px;
    font-weight: 560;
    white-space: nowrap;
    cursor: pointer;
    transition: background 120ms ease, transform 120ms ease;
  }

  .presence:hover {
    background: rgba(21, 21, 21, 0.065);
  }

  .presence:active {
    transform: translateY(1px);
  }

  .presence-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(16, 163, 127, 0.12);
  }

  .vbar {
    position: fixed;
    z-index: 12;
    top: calc(max(12px, env(safe-area-inset-top)) + 74px);
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    width: 10px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
  }

  .vbar.show {
    opacity: 1;
    pointer-events: auto;
  }

  .thumb {
    position: absolute;
    left: 2px;
    right: 2px;
    min-height: 28px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.34);
    cursor: grab;
    touch-action: none;
  }

  .thumb:active {
    cursor: grabbing;
  }

  .eraser-cursor {
    position: absolute;
    z-index: 11;
    width: 28px;
    height: 28px;
    border: 1.5px solid rgba(21, 21, 21, 0.72);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.32);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.72);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 80ms ease;
  }

  .eraser-cursor.show {
    opacity: 1;
  }

  .toast {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    max-width: min(420px, calc(100vw - 32px));
    transform: translate(-50%, 12px);
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-solid);
    box-shadow: var(--shadow);
    color: var(--text);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Панель страниц (блокнот) — слева, в стиле основного toolbar. */
  .pagebar {
    position: fixed;
    z-index: 20;
    top: max(18px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    width: max-content;
    max-width: calc(100vw - 24px);
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: var(--tb-pad);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
  }

  .page-indicator {
    /* Счётчик залит фоном во всю ширину — «воздуха» внутри бокса у него нет,
       поэтому зазор до стрелок добирается собственным полем. */
    margin-inline: calc(var(--tb-item) + var(--tb-slack-icon));
    min-width: 44px;
    min-height: var(--control);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(21, 21, 21, 0.045);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    user-select: none;
  }

  .page-indicator.pulse {
    animation: page-pulse 0.45s ease;
  }

  @keyframes page-pulse {
    from { transform: scale(1.34); }
    to { transform: scale(1); }
  }

  /* Резинка листа: пока прокрутку продолжают за конец страницы, лист (и его
     край) отъезжают на --pull, а отпущенный жест возвращает их пружиной. */
  .stage.pulling canvas,
  .stage.pulling .page-edge {
    transform: translateY(var(--pull, 0px));
  }

  /* Край листа — тонкая линия с мягкой тенью: видно, что бумага кончилась
     и её тянут за край. Позицию задаёт JS, она едет вместе с холстом. */
  .page-edge {
    position: absolute;
    z-index: 4;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(21, 21, 21, 0) 0%,
      rgba(21, 21, 21, 0.15) 14%,
      rgba(21, 21, 21, 0.15) 86%,
      rgba(21, 21, 21, 0) 100%);
    box-shadow: 0 7px 16px -7px rgba(0, 0, 0, 0.26);
    opacity: 0;
    pointer-events: none;
  }

  /* Индикатор продолжения: всплывает у края листа, когда прокрутку продолжают
     дальше конца страницы, и заполняется кольцом, пока усилие удерживают. */
  .page-hint {
    position: fixed;
    z-index: 25;
    left: 50%;
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 58px);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 14px 6px 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    color: var(--text);
    font-size: 13px;
    font-weight: 570;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, 14px);
    pointer-events: none;
  }

  .page-hint.top {
    bottom: auto;
    top: calc(var(--top-reserve) + 14px);
  }

  .page-hint svg {
    display: block;
    width: 26px;
    height: 26px;
    overflow: visible;
  }

  .hint-plus {
    display: none;
  }

  .page-hint.create .hint-plus {
    display: block;
  }

  .page-hint.create .hint-arrow {
    display: none;
  }

  .page-hint.top .hint-arrow {
    transform: rotate(180deg);
    transform-origin: 12px 12px;
  }

  /* Фолбэк пружинного «попа» при нажатии, если GSAP не загрузился. */
  .tap-pop {
    animation: tap-pop-kf 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes tap-pop-kf {
    from { transform: scale(0.8); }
    to { transform: scale(1); }
  }

  /* Тулбар и блокнот делят верхнюю строку, и оба имеют фиксированную ширину.
     Порог — момент, когда они перестают помещаться рядом: дальше блокнот
     уезжает вниз-влево, иначе он наезжает на цвета пера. */
  @media (max-width: 920px) {
    .pagebar {
      top: auto;
      bottom: max(12px, env(safe-area-inset-bottom));
    }
  }

  @media (max-width: 760px) {
    :root {
      --control: 31px;
      --top-reserve: calc(max(8px, env(safe-area-inset-top)) + var(--control) + 16px);
      /* Ступени поджимаются, но их порядок сохраняется: сосед < набор < группа. */
      --tb-pad: 5px;
      --tb-set: 6px;
      --tb-group: 12px;
    }

    .toolbar {
      top: max(8px, env(safe-area-inset-top));
      right: max(8px, env(safe-area-inset-right));
      width: max-content;
      max-width: calc(100vw - 16px);
    }

    .btn {
      padding: 0 8px;
      font-size: 12px;
    }

    .vbar {
      top: calc(max(8px, env(safe-area-inset-top)) + 62px);
      right: max(8px, env(safe-area-inset-right));
    }

    /* На узких экранах уводим панель страниц вниз-влево, чтобы не пересекаться
       с основным toolbar сверху. */
    .pagebar {
      top: auto;
      left: max(8px, env(safe-area-inset-left));
      bottom: max(8px, env(safe-area-inset-bottom));
    }

    /* Индикатор не должен налезать ни на toolbar сверху, ни на панель страниц снизу. */
    .page-hint {
      bottom: calc(max(8px, env(safe-area-inset-bottom)) + 52px);
    }

    .page-hint.top {
      top: calc(var(--top-reserve) + 10px);
    }
  }
</style>
</head>
<body>
<main class="app" aria-label="onCanvas">
  <section id="stage" class="stage" aria-label="Рабочая область доски">
    <canvas id="back"></canvas>
    <canvas id="ink"></canvas>
    <canvas id="overlay"></canvas>
    <div id="pageEdge" class="page-edge" aria-hidden="true"></div>
    <div id="eraserCursor" class="eraser-cursor" aria-hidden="true"></div>
    <div id="vbar" class="vbar" aria-hidden="true">
      <div id="thumb" class="thumb"></div>
    </div>
  </section>

  <header class="toolbar" aria-label="Инструменты доски">
    <div class="group colors" aria-label="Цвета ручки">
      <span class="group-label">Перо</span>
      <div id="penColors" class="swatches"></div>
    </div>

    <div class="group colors" aria-label="Цвета маркера">
      <span class="group-label">Маркер</span>
      <div id="hlColors" class="swatches"></div>
    </div>

    <div class="group tools" aria-label="Инструменты">
      <button id="lassoBtn" class="btn icon" type="button" aria-pressed="false" aria-label="Лассо" title="Лассо (L)">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="4" y="6" width="16" height="12" rx="2.5" fill="none" stroke="#10A37F" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"/>
        </svg>
        <sup class="tool-index" aria-hidden="true">L</sup>
      </button>
      <button id="eraserBtn" class="btn icon" type="button" aria-pressed="false" aria-label="Ластик" title="Ластик (E)">
        <svg class="m-icon" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
          <rect data-dc-tpl="8" x="9" y="25" width="102" height="70" rx="11" fill="#C9A87C"/>
          <rect data-dc-tpl="9" x="12" y="28" width="96" height="64" rx="8.5" fill="#EBD6B2"/>
          <g data-dc-tpl="10" transform="translate(19.9,14.7) scale(0.697)" fill="#1B3A6B">
            <path data-dc-tpl="11" d="M97 52 C106 58 107 70 103 79" fill="none" stroke="#1B3A6B" stroke-width="4" stroke-linecap="round"/>
            <ellipse data-dc-tpl="12" cx="69" cy="60" rx="32" ry="24"/>
            <rect data-dc-tpl="13" x="40" y="70" width="15" height="28" rx="7"/>
            <rect data-dc-tpl="14" x="63" y="70" width="12" height="25" rx="6"/>
            <rect data-dc-tpl="15" x="85" y="70" width="15" height="28" rx="7"/>
            <circle data-dc-tpl="16" cx="38" cy="56" r="21"/>
            <path data-dc-tpl="17" d="M30 42 C16 48 8 64 10 80 C11 89 15 95 21 95 C26 95 28 91 26 88 C24 85 21 86 20 82 C17 71 24 58 36 54 Z"/>
            <path data-dc-tpl="18" d="M40 36 C54 32 64 40 62 52 C60 63 50 68 44 62 C39 57 36 42 40 36 Z"/>
            <path data-dc-tpl="19" d="M26 68 C20 70 16 75 15 80" fill="none" stroke="#EBD6B2" stroke-width="5" stroke-linecap="round"/>
            <circle data-dc-tpl="20" cx="27" cy="51" r="3" fill="#EBD6B2"/>
          </g>
        </svg>
        <sup class="tool-index" aria-hidden="true">E</sup>
      </button>
      <div id="sizes" class="sizes set-start" aria-label="Толщина линии"></div>
    </div>

    <div class="group" aria-label="Файлы">
      <button id="imgBtn" class="btn icon" type="button" aria-label="Добавить изображение" title="Добавить изображение">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="i-image-frame" x1="4" y1="5" x2="20" y2="19" gradientUnits="userSpaceOnUse">
              <stop stop-color="#EAF2FF"/>
              <stop offset="1" stop-color="#A8C7FA"/>
            </linearGradient>
            <linearGradient id="i-image-hill" x1="7" y1="12" x2="18" y2="19" gradientUnits="userSpaceOnUse">
              <stop stop-color="#AEE8C8"/>
              <stop offset="1" stop-color="#10A37F"/>
            </linearGradient>
          </defs>
          <rect x="4.5" y="5" width="13.5" height="13.5" rx="3.2" fill="url(#i-image-frame)" class="m-edge"/>
          <circle cx="8.7" cy="9.1" r="1.8" fill="#FFD966" class="m-edge"/>
          <path d="m6.2 17 4.3-4.7 2.6 2.7 1.6-1.7 3.3 3.7H6.2Z" fill="url(#i-image-hill)"/>
          <circle cx="17.4" cy="16.8" r="4.2" fill="#D0BCFF" class="m-edge"/>
          <path d="M17.4 14.6V19M15.2 16.8h4.4" stroke="#4A336D" stroke-width="1.35" stroke-linecap="round"/>
          <path d="M7 6.9h5" stroke="rgba(255,255,255,.72)" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="exportBtn" class="btn icon" type="button" aria-label="Скачать PDF (все страницы)" title="Скачать PDF (все страницы)">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="i-export-arrow" x1="12" y1="4" x2="12" y2="15" gradientUnits="userSpaceOnUse">
              <stop stop-color="#B8F7D4"/>
              <stop offset="1" stop-color="#10A37F"/>
            </linearGradient>
            <linearGradient id="i-export-tray" x1="5" y1="13" x2="19" y2="21" gradientUnits="userSpaceOnUse">
              <stop stop-color="#E8EAED"/>
              <stop offset="1" stop-color="#A8C7FA"/>
            </linearGradient>
          </defs>
          <path d="M12 4.5v9.1" stroke="url(#i-export-arrow)" stroke-width="3" stroke-linecap="round"/>
          <path d="m8.5 10.6 3.5 3.5 3.5-3.5" fill="none" stroke="#087A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 14.8v2.8c0 1 .8 1.9 1.9 1.9h8.2c1 0 1.9-.8 1.9-1.9v-2.8" fill="none" stroke="url(#i-export-tray)" stroke-width="3" stroke-linecap="round"/>
          <path d="M8.4 17.4h7.2" stroke="rgba(255,255,255,.72)" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="group" aria-label="История">
      <button id="undoBtn" class="btn icon" type="button" title="Отменить (Ctrl/Cmd+Z)" disabled aria-label="Отменить">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="i-undo" x1="5" y1="7" x2="19" y2="18" gradientUnits="userSpaceOnUse">
              <stop stop-color="#D0BCFF"/>
              <stop offset="1" stop-color="#6750A4"/>
            </linearGradient>
          </defs>
          <path d="M9.5 8.2 5.6 12l3.9 3.8" fill="none" stroke="url(#i-undo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.4 12h6.8c3.1 0 5.1 1.9 5.1 4.5" fill="none" stroke="#6750A4" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M7.2 11.1h5.3" stroke="rgba(255,255,255,.7)" stroke-width="1.15" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="redoBtn" class="btn icon" type="button" title="Повторить (Ctrl/Cmd+Y)" disabled aria-label="Повторить">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="i-redo" x1="19" y1="7" x2="5" y2="18" gradientUnits="userSpaceOnUse">
              <stop stop-color="#A8C7FA"/>
              <stop offset="1" stop-color="#0B57D0"/>
            </linearGradient>
          </defs>
          <path d="m14.5 8.2 3.9 3.8-3.9 3.8" fill="none" stroke="url(#i-redo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17.6 12h-6.8c-3.1 0-5.1 1.9-5.1 4.5" fill="none" stroke="#0B57D0" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M16.8 11.1h-5.3" stroke="rgba(255,255,255,.7)" stroke-width="1.15" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="clearBtn" class="btn icon danger set-start" type="button" aria-label="Очистить страницу" title="Очистить страницу">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="i-clear-bin" x1="7" y1="5" x2="17" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFDAD6"/>
              <stop offset=".55" stop-color="#FF8A80"/>
              <stop offset="1" stop-color="#BA1A1A"/>
            </linearGradient>
          </defs>
          <path d="M8 8.5h8l-.6 9.4c-.1 1-1 1.8-2 1.8h-2.8c-1 0-1.9-.8-2-1.8L8 8.5Z" fill="url(#i-clear-bin)" class="m-edge"/>
          <path d="M7 7.2h10M10 7.2l.5-1.5h3l.5 1.5" fill="none" stroke="#7D1B1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.2 11.1v5.1M13.8 11.1v5.1" stroke="rgba(125,27,27,.62)" stroke-width="1.25" stroke-linecap="round"/>
          <path d="M9.8 9.5h4.8" stroke="rgba(255,255,255,.65)" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="group status" aria-label="Статус">
      <button id="presenceBtn" class="presence" type="button" title="Обновить страницу" aria-label="Обновить страницу">
        <span class="presence-dot" aria-hidden="true"></span>
        <span id="userCount">0</span>
        <span class="sr-only">онлайн</span>
      </button>
    </div>
  </header>

  <nav id="pagebar" class="pagebar" aria-label="Страницы">
    <div class="group" aria-label="Навигация по страницам">
      <button id="prevPageBtn" class="btn icon" type="button" aria-label="Предыдущая страница" title="Предыдущая страница ([)">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs><linearGradient id="i-page-prev" x1="6" y1="6" x2="15" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#A8C7FA"/><stop offset="1" stop-color="#0B57D0"/></linearGradient></defs>
          <path d="M14.5 5.8 8.6 12l5.9 6.2" fill="none" stroke="url(#i-page-prev)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span id="pageIndicator" class="page-indicator" aria-live="polite" title="Текущая страница / всего">1/1</span>
      <button id="nextPageBtn" class="btn icon" type="button" aria-label="Следующая страница" title="Следующая страница (])">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs><linearGradient id="i-page-next" x1="18" y1="6" x2="9" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#A8C7FA"/><stop offset="1" stop-color="#0B57D0"/></linearGradient></defs>
          <path d="M9.5 5.8 15.4 12l-5.9 6.2" fill="none" stroke="url(#i-page-next)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="group" aria-label="Управление страницами">
      <button id="addPageBtn" class="btn icon" type="button" aria-label="Добавить страницу" title="Добавить страницу">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs><linearGradient id="i-page-add" x1="6" y1="3" x2="18" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#EAF2FF"/><stop offset="1" stop-color="#A8C7FA"/></linearGradient></defs>
          <path d="M7.4 3.5h5.6L17.6 8v11.5a1 1 0 0 1-1 1H7.4a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" fill="url(#i-page-add)" class="m-edge"/>
          <path d="M13 3.7V7.4a1 1 0 0 0 1 1h3.5" fill="none" stroke="#4A6DA6" stroke-width="1.15" stroke-linecap="round"/>
          <circle cx="16.4" cy="16.4" r="4.7" fill="#10A37F" class="m-edge"/>
          <path d="M16.4 14.1v4.6M14.1 16.4h4.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="delPageBtn" class="btn icon set-start" type="button" aria-label="Удалить страницу" title="Удалить страницу">
        <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <defs><linearGradient id="i-page-del" x1="6" y1="3" x2="18" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF1F0"/><stop offset="1" stop-color="#FFCDCB"/></linearGradient></defs>
          <path d="M7.4 3.5h5.6L17.6 8v11.5a1 1 0 0 1-1 1H7.4a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" fill="url(#i-page-del)" class="m-edge"/>
          <path d="M13 3.7V7.4a1 1 0 0 0 1 1h3.5" fill="none" stroke="#C0687F" stroke-width="1.15" stroke-linecap="round"/>
          <circle cx="16.4" cy="16.4" r="4.7" fill="#BA1A1A" class="m-edge"/>
          <path d="M14.1 16.4h4.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </nav>

  <div id="pageHint" class="page-hint" aria-hidden="true">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <defs><linearGradient id="i-hint" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#3ED2A7"/><stop offset="1" stop-color="#10A37F"/></linearGradient></defs>
      <circle cx="12" cy="12" r="9.4" fill="none" stroke="rgba(21, 21, 21, 0.10)" stroke-width="2.4"/>
      <circle id="pageHintRing" cx="12" cy="12" r="9.4" fill="none" stroke="url(#i-hint)" stroke-width="2.4"
              stroke-linecap="round" stroke-dasharray="59.06" stroke-dashoffset="59.06" transform="rotate(-90 12 12)"/>
      <path class="hint-arrow" d="M12 8.1v7.6M8.8 12.6 12 15.8l3.2-3.2" fill="none" stroke="var(--ui-strong)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="hint-plus" d="M12 8.3v7.4M8.3 12h7.4" fill="none" stroke="var(--ui-strong)" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <span id="pageHintLabel" class="page-hint-label">Новая страница</span>
  </div>

  <input id="fileInput" class="sr-only" type="file" accept="image/*">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>

<script type="module">
import { BoardStorage } from './storage.js';
import { CanvasRenderer } from './canvas.js';
import { NetworkManager } from './network.js';
import { HistoryManager } from './history.js';
import { ToolManager } from './tools.js';

(function() {
  "use strict";

  const storage = new BoardStorage();

  const renderer = new CanvasRenderer(storage);
  // Удалённые операции и undo/redo только помечают кадр «грязным» —
  // фактическая перерисовка коалесится в один вызов на animation frame.
  const network = new NetworkManager(
    storage,
    () => renderer.scheduleRender(),
    (point) => renderer.focusWorldPoint(point)
  );
  network.onRemoteCursor = (clientId, point) => renderer.setRemoteCursor(clientId, point);
  const history = new HistoryManager(storage, network, () => renderer.scheduleRender());
  const tools = new ToolManager(storage, renderer, network, history);
  // Участник ушёл на другой лист и начал там писать — уводим за ним остальных.
  network.onRemotePage = (pageId, point) => tools.followRemotePage(pageId, point);
  document.getElementById('presenceBtn')?.addEventListener('click', () => window.location.reload());

  network.init();

  // Expose globally for testing/debugging
  window._board = { storage, renderer, network, history, tools };
})();
</script>
</body>
</html>
